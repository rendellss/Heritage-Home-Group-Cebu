<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Font Test</title>
  <style>
    /* Define the custom font using your exact filename */
    @font-face {
      font-family: 'Catchy Mager';
      src: url('./fonts/catchy-mager.otf') format('opentype');
    }

    .custom-font {
      font-family: 'Catchy Mager', serif;
      font-size: 48px;
    }

    .fallback-font {
      font-family: serif;
      font-size: 48px;
    }
  </style>
</head>

<body>

  <h2>Testing Local Font File:</h2>
  <div class="custom-font">
    <p class="custom-font">
      The quick brown fox jumps over the lazy dog. 1234567890
    </p>
  </div>
  <hr>

  <h2>Standard Serif Font (for comparison):</h2>

  <p class="fallback-font">
    The quick brown fox jumps over the lazy dog. 1234567890
  </p>

</body>

</html>
